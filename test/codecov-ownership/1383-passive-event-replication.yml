references: ["#1383", "PR #1408"]
rationale: >-
  Adds the daemon-owned passive-event replication pass beside the processor
  that drives it, so both stay in the passive-events owner; the sweep-driven
  pass, its gates and operator counters are daemon-events-owned. Replication
  construction and shutdown in the server stay daemon-core-owned, the
  background replication status block stays route-owned, and the per-phase
  admission of the worker keeps its PostgreSQL passive-events owner.
