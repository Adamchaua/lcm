references: ["#1441"]
rationale: >-
  #1441 adds a partial (project_id, content, created_at) index so the SQLite
  exact-content dedup lookup is index-backed; migration.ts keeps its
  established owner. promoted.ts adds rowid tie-breaks so the new index leaves
  same-second result order unchanged; it keeps its established owner. The
  dedup.ts edit is comment-only and not material.
pins:
