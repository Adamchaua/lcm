references: ["#1509"]
rationale: >-
  #1509 recovers rows that were replicated to a previous remote project after a
  relink: the worker re-queues or settles them, the repository withdraws this
  machine's copies from other projects, and the local outbox gains the
  replicated-to-pending transition. Every changed file keeps its current owner.
