references: ["#1537"]
rationale: >-
  #1537 makes the five registered read routes (search, grep, recent,
  describe, expand) answer a sanitized 503 on PostgreSQL when project storage
  rejects, through a new storageReadFailureResponse helper in
  storage-lifecycle; all six files keep their existing daemon-routes owner.
