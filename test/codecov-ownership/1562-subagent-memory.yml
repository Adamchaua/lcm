references: ["#1562"]
rationale: >-
  Adds src/hooks/subagent-scope.ts, the pure helper that keys a Codex
  subagent hook payload by its own thread id, to the hook handlers it serves;
  the directory-level hooks owner already covers it, so there is no topology
  change. src/hooks/restore.ts, session-snapshot.ts, post-tool.ts,
  user-prompt.ts and dispatch.ts are materially changed and keep that owner.
  src/connectors/codex-hooks.ts (SubagentStart and SubagentStop registration)
  is materially changed and keeps its connectors owner. No file is removed,
  moved or re-owned.
pins:
  - ["src/hooks/subagent-scope.ts", "unit-hooks"]
  - ["src/hooks/restore.ts", "unit-hooks"]
  - ["src/hooks/session-snapshot.ts", "unit-hooks"]
  - ["src/hooks/post-tool.ts", "unit-hooks"]
  - ["src/hooks/user-prompt.ts", "unit-hooks"]
  - ["src/hooks/dispatch.ts", "unit-hooks"]
  - ["src/connectors/codex-hooks.ts", "unit-connectors"]
