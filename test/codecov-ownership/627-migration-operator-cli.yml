references: ["#627"]
rationale: >-
  Adds the `lcm migration` operator CLI (plan, dry-run, apply, abort): the
  command renderers, the target configuration, identity and reachability
  resolvers, the daemon-presence, hold-entry and hold-continuation fences,
  the apply and genesis-copy drivers and the typed refusal and exit-class
  mapping and the boundary catch that turns an unclassified throw into one
  closed refusal. They all live under src/migration/ and stay in the directory-level
  migration cutover owner; no topology change. bin/lcm.ts and
  src/cli-help.ts only dispatch to and describe the new command and remain
  in the CLI owner. The manifest store gains a three-valued manifest presence
  probe, and src/daemon/config.ts exports the backend-independent
  PostgreSQL settings resolver the migration target configuration reuses;
  both keep their established owners.
